# Builds the signed MH Analyst APK on GitHub's computers.
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   MH_KEYSTORE_BASE64  - the mh-analyst-release.jks file, base64-encoded
#   MH_STORE_PASSWORD   - its password
# Run it from the Actions tab ("Build APK" > Run workflow). The APK appears under the run as "MH-Analyst-apk".
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEY_B64: ${{ secrets.MH_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEY_B64" ]; then echo "::error::Add the MH_KEYSTORE_BASE64 secret first (see BUILD-GUIDE.md)"; exit 1; fi
          echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/mh-analyst-release.jks"

      - name: Build signed APK
        env:
          MH_KEYSTORE: ${{ runner.temp }}/mh-analyst-release.jks
          MH_STORE_PASSWORD: ${{ secrets.MH_STORE_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk MH-Analyst.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MH-Analyst-apk
          path: MH-Analyst.apk
          retention-days: 30
